<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener</title>
<script src="/tc-static/vendor/lightweight-charts-4.1.1.standalone.production.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js';document.head.appendChild(s);"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-primary: #131722;
    --bg-secondary: #1e222d;
    --bg-tertiary: #2a2e39;
    --border-color: #363a45;
    --text-primary: #d1d4dc;
    --text-secondary: #787b86;
    --accent-blue: #2962ff;
    --green: #089981;
    --red: #f23645;
    --chart-bg: #131722;
    --chart-grid: #1e222d;
    --chart-watermark: rgba(209, 212, 220, 0.05);
    --panel-bg: rgba(0, 0, 0, 0.85);
    --overlay-bg: rgba(30, 34, 45, 0.85);
}

body.theme-light {
    --bg-primary: #ffffff;
    --bg-secondary: #f4f5f8;
    --bg-tertiary: #e9ebee;
    --border-color: #d6d8e0;
    --text-primary: #131722;
    --text-secondary: #5d606b;
    --accent-blue: #1565c0;
    --green: #089981;
    --red: #d32f2f;
    --chart-bg: #ffffff;
    --chart-grid: #eef0f3;
    --chart-watermark: rgba(19, 23, 34, 0.05);
    --panel-bg: rgba(255, 255, 255, 0.95);
    --overlay-bg: rgba(244, 245, 248, 0.92);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.chart-grid {
    flex: 1;
    display: grid;
    gap: 1px;
    background: var(--border-color);
    overflow: hidden;
    min-width: 0;
}

.chart-grid[data-count="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.chart-grid[data-count="2"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.chart-grid[data-count="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.chart-grid[data-count="6"] { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
.chart-grid[data-count="8"] { grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }

.chart-pane {
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
    position: relative;
    overflow: hidden;
}

.symbol-input-wrap { position: relative; }

.symbol-input {
    width: 110px;
    height: 22px;
    padding: 0 6px;
    background: var(--overlay-bg);
    border: 1px solid var(--border-color);
    border-radius: 3px;
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 600;
    outline: none;
}

.symbol-input:focus { border-color: var(--accent-blue); }

.symbol-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 220px;
    max-height: 240px;
    overflow-y: auto;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 1000;
    display: none;
}

.symbol-dropdown.visible { display: block; }

.symbol-option {
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-primary);
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}

.symbol-option:hover { background: var(--bg-tertiary); }
.symbol-option strong { display: block; font-size: 12px; }
.symbol-option span { color: var(--text-secondary); font-size: 10px; }

.timeframe-select {
    height: 22px;
    padding: 0 4px;
    background: var(--overlay-bg);
    border: 1px solid var(--border-color);
    border-radius: 3px;
    color: var(--text-primary);
    font-size: 10px;
    outline: none;
    cursor: pointer;
    max-width: 120px;
}

.timeframe-select:focus { border-color: var(--accent-blue); }

.pane-btn {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--overlay-bg);
    border: 1px solid var(--border-color);
    border-radius: 3px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
}

.pane-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--accent-blue);
    color: var(--text-primary);
}

.chart-pane.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    border-radius: 0;
}

.ticker-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    border-radius: 3px;
    padding: 1px 6px;
}

.ticker-ltp { font-weight: 700; font-size: 12px; }
.ticker-change { font-size: 10px; font-weight: 500; }

.chart-container {
    flex: 1;
    position: relative;
    min-height: 0;
}

.loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--bg-primary) 80%, transparent);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
}

.loading-overlay.active { opacity: 1; pointer-events: all; }

.loading-spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border-color);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.chart-watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 700;
    color: var(--chart-watermark);
    pointer-events: none;
    z-index: 1;
    text-align: center;
    white-space: pre-line;
}

.ohlc-legend {
    font-size: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    pointer-events: none;
    display: inline;
    white-space: nowrap;
}

.chart-overlay-top {
    position: absolute;
    top: 6px;
    left: 6px;
    right: 75px;
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 4px 8px;
    z-index: 20;
    pointer-events: auto;
}

.chart-overlay-right {
    position: absolute;
    top: 6px;
    right: 70px;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 20;
}

.main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
}

.drawing-sidebar {
    width: 42px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0;
    gap: 2px;
    overflow-y: auto;
    flex-shrink: 0;
}

.draw-tool-btn {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
}

.draw-tool-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.draw-tool-btn.active { background: rgba(41, 98, 255, 0.15); border-color: var(--accent-blue); color: var(--accent-blue); }

.draw-separator { width: 26px; height: 1px; background: var(--border-color); margin: 4px 0; }
.sidebar-spacer { flex: 1; }

.sidebar-control {
    width: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 2px 0;
}

.sidebar-label {
    font-size: 9px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}

.sidebar-flyout {
    display: none;
    position: fixed;
    min-width: 120px;
    background: #1e1e2e;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    z-index: 9998;
    padding: 6px 0;
}

.sidebar-flyout.open { display: block; }

.sidebar-flyout-row {
    display: flex;
    align-items: center;
    padding: 6px 14px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--text-secondary);
    gap: 8px;
    white-space: nowrap;
}

.sidebar-flyout-row:hover { background: var(--bg-secondary); color: var(--text-primary); }
.sidebar-flyout-row.selected { color: var(--accent-blue); font-weight: 600; }
.sidebar-flyout-row.selected::before {
    content: '\2713';
    font-size: 11px;
    color: var(--accent-blue);
    margin-right: 2px;
}

.sidebar-flyout-row .tool-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    margin-left: auto;
    color: var(--text-primary);
}

.sidebar-live {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

.indi-menu-btn {
    width: 34px;
    height: 28px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-secondary);
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
}

.indi-menu-btn:hover { color: var(--text-primary); border-color: var(--accent-blue); }
.indi-menu-btn.has-active { color: var(--accent-blue); border-color: var(--accent-blue); }

.values-meta {
    padding: 4px 12px 8px;
    font-size: 10px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 4px;
}

.pane-empty-note {
    position: absolute;
    bottom: 12px;
    left: 12px;
    font-size: 11px;
    color: var(--text-secondary);
    z-index: 20;
    pointer-events: none;
}
</style>
</head>
<body>
<div class="main-area">
    <div class="drawing-sidebar" id="drawingSidebar">
        <button class="draw-tool-btn" title="Cursor"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/></svg></button>
        <div class="draw-separator"></div>
        <div class="sidebar-control" title="Line Tools"><span class="sidebar-label">Line</span><button class="indi-menu-btn" id="lineToolsBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg></button></div>
        <div class="sidebar-control" title="Shape Tools"><span class="sidebar-label">Draw</span><button class="indi-menu-btn" id="shapeToolsBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1"/></svg></button></div>
        <div class="draw-separator"></div>
        <div class="sidebar-control" title="Time Duration"><span class="sidebar-label">Time</span><button class="indi-menu-btn" id="timeMenuBtn">1Y</button></div>
        <div class="sidebar-control" title="Metric"><span class="sidebar-label">Metric</span><button class="indi-menu-btn" id="valuesMenuBtn">fx</button></div>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-control" title="Toggle Theme"><span class="sidebar-label">Theme</span><button class="indi-menu-btn" id="themeToggleBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></div>
        <div class="sidebar-control" title="No of Charts"><span class="sidebar-label">Chart</span><button class="indi-menu-btn" id="chartMenuBtn">4</button></div>
        <button class="draw-tool-btn" id="pageScreenshot" title="Screenshot Page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M5 7h.01M19 7h.01"/></svg></button>
        <button class="draw-tool-btn" id="pageFullscreen" title="Fullscreen Page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
        <div class="sidebar-live" title="Live"><span class="status-dot"></span></div>
    </div>
    <div class="chart-grid" id="chartGrid"></div>
</div>

<div class="sidebar-flyout" id="lineToolsFlyout"><div class="sidebar-flyout-row"><span>Trend Line</span></div><div class="sidebar-flyout-row"><span>Ray</span></div><div class="sidebar-flyout-row"><span>Horizontal Line</span></div><div class="sidebar-flyout-row"><span>Vertical Line</span></div></div>
<div class="sidebar-flyout" id="shapeToolsFlyout"><div class="sidebar-flyout-row"><span>Parallel Channel</span></div><div class="sidebar-flyout-row"><span>Rectangle</span></div><div class="sidebar-flyout-row"><span>Price Range</span></div><div class="sidebar-flyout-row"><span>Date Range</span></div></div>
<div class="sidebar-flyout" id="timeFlyout"><div class="sidebar-flyout-row" data-val="365">1 Year</div><div class="sidebar-flyout-row" data-val="1095">3 Years</div><div class="sidebar-flyout-row selected" data-val="1825">5 Years</div><div class="sidebar-flyout-row" data-val="3650">10 Years</div><div class="sidebar-flyout-row" data-val="99999">MAX</div></div>
<div class="sidebar-flyout" id="chartFlyout"><div class="sidebar-flyout-row" data-val="1">1 Chart</div><div class="sidebar-flyout-row" data-val="2">2 Charts</div><div class="sidebar-flyout-row selected" data-val="4">4 Charts</div><div class="sidebar-flyout-row" data-val="6">6 Charts</div><div class="sidebar-flyout-row" data-val="8">8 Charts</div></div>
<div class="sidebar-flyout" id="valuesFlyout" style="width:max-content;min-width:140px;max-width:280px"><div class="values-meta" id="valuesMeta">Loading values...</div><div id="valuesList"></div></div>

<script src="/static/replica.js"></script>
</body>
</html>
